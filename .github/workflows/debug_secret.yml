name: Debug secret
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - env:
          V: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
        run: |
          echo "len=${#V}"
          echo "first 3 hex: $(printf '%s' "$V" | head -c 3 | od -An -c | tr -d ' ')"
          echo "last 3 hex:  $(printf '%s' "$V" | tail -c 3 | od -An -c | tr -d ' ')"
