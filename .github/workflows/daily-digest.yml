name: Daily digest 7h sáng VN

# 7:00 VN = 0:00 UTC. Multi-cron strategy chống GitHub Actions jitter:
# fire 4 lần/sáng (00:00, 00:30, 01:00, 02:00 UTC = 07:00, 07:30, 08:00, 09:00 VN).
# Idempotent qua `bot_meta.last_digest_date` — lần đầu fire thành công sẽ
# set meta, các lần sau skip.
# Lý do: GitHub Actions cron free tier có jitter 1-6h, đôi khi 1 cron không
# fire kịp → cần multi-cron để có ít nhất 1 lần fire trước 9h sáng VN.
on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 07:00 VN
    - cron: "30 0 * * *"  # 00:30 UTC = 07:30 VN
    - cron: "0 1 * * *"   # 01:00 UTC = 08:00 VN
    - cron: "0 2 * * *"   # 02:00 UTC = 09:00 VN
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ACCOUNT: ${{ secrets.GOOGLE_CALENDAR_ACCOUNT }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CONTACT_NAME: ${{ secrets.CONTACT_NAME }}
          CONTACT_TITLE: ${{ secrets.CONTACT_TITLE }}
        run: python scripts/trigger_digest.py
